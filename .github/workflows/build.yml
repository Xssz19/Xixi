
name: Build Guardrail APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Unzip Android project
        run: |
          mkdir -p app_source
          unzip -o guardrail_project.zip -d app_source

      - name: Find Android project
        shell: bash
        run: |
          BUILD_FILE=$(find app_source \
            -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            -exec cp {} output/ \;

          if ! ls output/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardrail-Measurement-APK
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error
